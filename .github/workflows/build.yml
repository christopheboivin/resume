name: Build CV

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern cm-super

      - name: Build
        run: bash build.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: dist/*.pdf
          retention-days: 30
