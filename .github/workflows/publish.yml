name: Publish CV

# Manual run: builds "<PDF name> - <occasion>.pdf", uploads it as an artifact and
# attaches it to a GitHub Release whose notes are generated by git-cliff (cliff.toml)
# from the commits since the previous cv-* release.

on:
  workflow_dispatch:
    inputs:
      occasion:
        description: 'Occasion, appended to the PDF name (e.g. "Salon Tech Lyon")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute names
        id: meta
        env:
          OCCASION: ${{ inputs.occasion }}
        run: |
          occasion=$(printf '%s' "$OCCASION" | tr -d '/\:*?"<>|' | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')
          if [[ -z "$occasion" ]]; then
            echo "::error::occasion is empty after sanitizing"
            exit 1
          fi
          slug=$(printf '%s' "$occasion" | iconv -f utf-8 -t ascii//TRANSLIT | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g')
          date=$(date +%F)
          tag="cv-${date}${slug:+-$slug}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"
            exit 1
          fi
          {
            echo "occasion=$occasion"
            echo "slug=${slug:-occasion}"
            echo "date=$date"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern cm-super

      - name: Build
        env:
          PDF_SUFFIX: ${{ steps.meta.outputs.occasion }}
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: cv-${{ steps.meta.outputs.slug }}
          path: dist/*.pdf
          retention-days: 90

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag ${{ steps.meta.outputs.tag }} --strip header
        env:
          OUTPUT: notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: CV – ${{ steps.meta.outputs.occasion }} (${{ steps.meta.outputs.date }})
        run: |
          file=$(cd dist && ls *.pdf)
          gh release create "$TAG" "dist/$file#$file" \
            --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md
